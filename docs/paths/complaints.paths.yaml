paths:
  /api/complaints:
    get:
      summary: Get all complaints (Admin)
      tags: [Complaints]
      description: Retrieves a paginated list of complaints. Requires admin privileges. Supports filtering by status.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of complaints per page.
        - in: query
          name: status
          schema:
            type: string
            enum: [new, in_progress, resolved, closed]
          description: Filter complaints by status.
      responses:
        "200":
          description: A list of complaints retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ComplaintsResponseData'
                      message:
                        example: "Complaints retrieved successfully"
        "401":
          description: Unauthorized (Invalid or missing token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: "invalid token"
                success: false
        "403":
          description: Forbidden (User is not an admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 403
                message: "You do not have permission to perform this action"
                success: false

  /api/complaints/{id}:
    get:
      summary: Get a specific complaint by ID (Admin)
      tags: [Complaints]
      description: Retrieves the details of a single complaint, including user information and replies. Requires admin privileges.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the complaint to retrieve.
          example: "68fce2b67914864105e1625c"
      responses:
        "200":
          description: Complaint details retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          complaint:
                            $ref: '#/components/schemas/Complaint'
                      message:
                        example: "Complaint retrieved successfully"
        "400":
          description: Bad Request (Invalid ID format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: "Invalid complaint ID format"
                success: false
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: "invalid token"
                success: false
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 403
                message: "You do not have permission to perform this action"
                success: false
        "404":
          description: Not Found (Complaint with the specified ID does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: "Complaint not found"
                success: false

  /api/complaints/{id}/reply:
    post:
      summary: Reply to a complaint (Admin)
      tags: [Complaints]
      description: Adds an admin reply to a specific complaint, updates its status to 'resolved', and attempts to notify the user via WebSocket if connected. Requires admin privileges.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The ID of the complaint to reply to.
          example: "68fce2b67914864105e1625c"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                replyMessage:
                  type: string
                  description: The content of the admin's reply.
              required:
                - replyMessage
            example:
              replyMessage: "We have processed your request and issued a refund."
      responses:
        "200":
          description: Reply added successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          complaint:
                            $ref: '#/components/schemas/Complaint'
                      message:
                        example: "Reply added successfully"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingMessage:
                  value:
                    statusCode: 400
                    message: "Reply message is required"
                    success: false
                invalidId:
                  value:
                    statusCode: 400
                    message: "Invalid complaint ID format"
                    success: false
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: "invalid token"
                success: false
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 403
                message: "You do not have permission to perform this action"
                success: false
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: "Complaint not found"
                success: false
  /api/complaints/user/create:
    post:
      summary: Submit a new complaint (User)
      tags: [Complaints]
      description: |
        Allows a user to submit a new complaint regarding an order or a general issue.
        Ensures the user does not already have an open complaint (status: new or inProgress).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                details:
                  type: string
                  description: The complaint details
                orderId:
                  type: string
                  nullable: true
                  description: The related order ID (optional)
              required:
                - details
            example:
              details: "The book was damaged when delivered"
              orderId: "68fce2b67914864105e1625c"
      responses:
        "201":
          description: Complaint submitted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Your complaint has been submitted successfully."
                  data:
                    type: object
                    properties:
                      complaint:
                        $ref: "#/components/schemas/Complaint"
        "400":
          description: Bad Request (Missing details or open complaint exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingDetails:
                  value:
                    statusCode: 400
                    message: "Complaint details are required"
                    success: false
                existingComplaint:
                  value:
                    statusCode: 400
                    message: "You already have an open complaint (Status: new). Please wait for us to resolve it."
                    success: false
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: "invalid token"
                success: false
        "404":
          description: Order not found (if provided orderId doesn't belong to user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: "Order not found"
                success: false

  /api/complaints/user:
    get:
      summary: Get all complaints for a user
      tags: [Complaints]
      description: Retrieves all complaints submitted by the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User complaints retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ComplaintsResponseData'
                      message:
                        example: "User complaints retrieved successfully"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: "invalid token"
                success: false

  /api/complaints/user/{id}:
    get:
      summary: Get a specific complaint for a user
      tags: [Complaints]
      description: Retrieves a specific complaint created by the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Complaint ID
      responses:
        "200":
          description: Complaint retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          complaint:
                            $ref: '#/components/schemas/Complaint'
                      message:
                        example: "Complaint retrieved successfully"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: "invalid token"
                success: false
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: "Complaint not found"
                success: false

  /api/complaints/user/{id}/reply:
    post:
      summary: Reply to a complaint (User)
      tags: [Complaints]
      description: Allows a user to reply to their own complaint.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Complaint ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                replyMessage:
                  type: string
                  description: Reply content from the user.
              required:
                - replyMessage
            example:
              replyMessage: "Thanks for the quick response."
      responses:
        "200":
          description: Reply added successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          complaint:
                            $ref: '#/components/schemas/Complaint'
                      message:
                        example: "Reply added successfully"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: "Reply message is required"
                success: false
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: "invalid token"
                success: false
        "404":
          description: Complaint not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: "Complaint not found"
                success: false