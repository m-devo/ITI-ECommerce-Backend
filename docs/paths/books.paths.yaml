paths:

  /api/admin/book/allBooks:
    get:
      summary: Get all books
      description: Retrieve a paginated list of all available books with optional filters.
      tags: [Books]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            example: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
          description: Number of books per page
        - in: query
          name: author
          schema:
            type: string
          description: Filter by author name
        - in: query
          name: category
          schema:
            type: string
          description: Filter by category
        - in: query
          name: title
          schema:
            type: string
          description: Filter by book title
        - in: query
          name: minPrice
          schema:
            type: number
          description: Minimum price filter
        - in: query
          name: maxPrice
          schema:
            type: number
          description: Maximum price filter
      responses:
        "200":
          description: Successfully retrieved list of books
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  message:
                    type: string
                    example: "Books fetched successfully"
        "404":
          description: No books found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
/api/admin/book/create
    post:
      summary: Create a new book
      description: Add a new book to the database (Admin only).
      tags: [Books]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Deep Learning with Python"
                author:
                  type: string
                  example: "François Chollet"
                descrption:
                  type: string
                  example: "A comprehensive guide to deep learning using Keras and TensorFlow."
                price:
                  type: number
                  example: 120
                stock:
                  type: integer
                  example: 30
                category:
                  type: string
                  example: "AI"
                book:
                  type: string
                  format: binary
                  description: PDF or book file
                image:
                  type: string
                  format: binary
                  description: Cover image file
      responses:
        "201":
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /api/admin/book/oneBook/{ID}:
    get:
      summary: Get book by ID
      description: Retrieve detailed information about a specific book.
      tags: [Books]
      parameters:
        - in: path
          name: ID
          required: true
          schema:
            type: string
          description: The ID of the book
      responses:
        "200":
          description: Successfully retrieved book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "400":
          description: Invalid Book ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

/api/admin/book/update/{ID}
    patch:
      summary: Update a book by ID
      description: Update book details or replace its files (Admin only).
      tags: [Books]
      parameters:
        - in: path
          name: ID
          required: true
          schema:
            type: string
          description: The ID of the book
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                author:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                descrption:
                  type: string
                category:
                  type: string
                book:
                  type: string
                  format: binary
                  description: New book file to upload
                image:
                  type: string
                  format: binary
                  description: New image file to upload
      responses:
        "200":
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


/api/admin/book/delete/{ID}
    delete:
      summary: Delete a book by ID
      description: Mark a book as deleted (soft delete).
      tags: [Books]
      parameters:
        - in: path
          name: ID
          required: true
          schema:
            type: string
          description: The ID of the book
      responses:
        "200":
          description: Book marked as deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "400":
          description: Invalid Book ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
