paths:
  /api/user/profile:
    get:
      summary: Get user profile
      description: Retrieve the authenticated user's profile information
      tags: [User Profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: User Profile retrieved successfully
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: "invalid token"
                success: false


  /api/user/orders:
    get:
      summary: Get user orders
      description: Retrieve the authenticated user's order history
      tags: [User Profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  message:
                    type: string
                    example: User Orders retrieved successfully
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: "invalid token"
                success: false

  /api/user/books:
    get:
      summary: Get user books
      description: Retrieve the books purchased by the authenticated user
      tags: [User Profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User books retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  message:
                    type: string
                    example: User Books successfully
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: "invalid token"
                success: false