paths:
  /api/features/bookOftheDay:
    get:
      summary: Get the current "Book of the Day"
      tags: [Book Features]
      description: Retrieves the currently featured book of the day.
      responses:
        "200":
          description: Book of the day retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  book:
                    _id: "68e7ed98aa7000812ffe6213"
                    title: "Three Body Problems"
                    author: "Liu Cixin"
                    price: 300
                    featuredAt: "2025-10-23T03:00:00.000Z"
                message: "Book of the day retrieved successfully"
                success: true
        "404":
          description: Not Found (No book of the day is currently set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: "No book of the day found"
                success: false

/api/features/{id}/manual-book-of-the-day:
  post:
    summary: Set a book as "Book of the Day" (Admin)
    tags: [Book Features]
    description: >
      Manually sets a specific book as the featured "Book of the Day".
      This will clear the previous book of the day and also invalidate the 'homepage' cache.
      Restricted to 'admin' users.
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The ID of the book to feature.
        example: "68e7ed98aa7000812ffe6213"
    responses:
      "200":
        description: Book of the day has been set successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            example:
              statusCode: 200
              data:
                book:
                  _id: "68e7ed98aa7000812ffe6213"
                  title: "Three Body Problems"
                  author: "Liu Cixin"
                  price: 300
                  featuredAt: "2025-10-23T04:00:00.000Z"
              message: "Book of the day has been set successfully"
              success: true
      "400":
        description: Bad Request (e.g., Book ID is missing).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 400
              message: "Book ID is required"
              success: false
      "401":
        description: Unauthorized (Invalid or missing token).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 401
              message: "invalid token"
              success: false
      "403":
        description: Forbidden (User is not an admin).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 403
              message: "You do not have permission to perform this action"
              success: false

/api/features/homepage:
  get:
    summary: Get cached data for the homepage
    tags: [Book Features]
    description: >
      Retrieves the main data for the homepage. This endpoint is cached.
      It returns the latest books and the featured book of the day.
    responses:
      "200":
        description: Homepage data retrieved successfully (from cache or database).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            example:
              statusCode: 200
              data:
                latestBooks:
                  - _id: "68e817158483527382d205ea"
                    title: "Three Body Problems"
                    author: "Liu Cixin"
                    price: 40
                featuredBook:
                  _id: "68e7ed98aa7000812ffe6213"
                  title: "Twilight"
                  author: "Stephenie Meyer"
                  price: 200
                  featuredAt: "2025-10-23T03:00:00.000Z"
              message: "Data retrieved from database"
              success: true
