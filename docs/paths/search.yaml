/api/search:
  get:
    summary: Basic full-text search for books
    tags:
      - Search
    parameters:
      - in: query
        name: query
        schema:
          type: string
        required: true
        description: Text to search within book titles or descriptions or categories
        example: "database"
    responses:
      "200":
        description: Search results for books
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Book"
      "400":
        description: Missing query
      "500":
        description: Server error

/api/search/suggest:
  get:
    summary: Suggest or autocomplete book titles
    tags:
      - Search
    parameters:
      - in: query
        name: query
        schema:
          type: string
        required: true
        description: Partial text for autocomplete suggestions
        example: "har"
    responses:
      "200":
        description: List of suggested book titles
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Book"
      "400":
        description: Missing query
      "500":
        description: Server error

/api/search/facets:
  get:
    summary: Filter books by author, category and price range
    tags:
      - Search
    parameters:
      - in: query
        name: author
        schema:
          type: string
        required: false
        example: "George Orwell"
      - in: query
        name: category
        schema:
          type: string
        required: false
        example: "Programming"
      - in: query
        name: minPrice
        schema:
          type: number
        required: false
        example: 10
      - in: query
        name: maxPrice
        schema:
          type: number
        required: false
        example: 50
    responses:
      "200":
        description: Filtered list of books
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Book"
      "500":
        description: Server error
