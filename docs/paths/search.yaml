/api/search:
  get:
    summary: Basic full-text search for books
    tags:
      - Search
    parameters:
      - in: query
        name: query
        schema:
          type: string
        required: true
        description: Text to search within book titles or descriptions or categories
        example: "database"
    responses:
      "200":
        description: Search results for books
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                statusCode:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: "Searched Books"
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/Book"
      "400":
        description: Missing search query
      "500":
        description: Server error

/api/search/suggest:
  get:
    summary: Suggest or autocomplete book titles
    tags:
      - Search
    parameters:
      - in: query
        name: query
        schema:
          type: string
        required: true
        description: Partial text for autocomplete suggestions
        example: "har"
    responses:
      "200":
        description: List of suggested book titles
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                statusCode:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: "Searched Books"
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                        example: "Harry Potter"
                      author:
                        type: string
                        example: "J.K. Rowling"
      "400":
        description: Missing query
      "500":
        description: Server error

/api/search/facets:
  get:
    summary: Filter books by author, category, price range, and sort with pagination
    tags:
      - Search
    parameters:
      - in: query
        name: author
        schema:
          type: string
        required: false
        example: "George Orwell"
      - in: query
        name: category
        schema:
          type: string
        required: false
        example: "Database"
      - in: query
        name: minPrice
        schema:
          type: number
        required: false
        example: 10
      - in: query
        name: maxPrice
        schema:
          type: number
        required: false
        example: 50
      - in: query
        name: page
        schema:
          type: integer
        required: false
        example: 1
      - in: query
        name: limit
        schema:
          type: integer
        required: false
        example: 10
      - in: query
        name: sort
        schema:
          type: string
        required: false
        description: Field and order to sort by, e.g., "price:asc" or "createdAt:desc"
        example: "price:asc"
    responses:
      "200":
        description: Filtered list of books with pagination info
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                statusCode:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: "Searched Books"
                data:
                  type: object
                  properties:
                    books:
                      type: array
                      items:
                        $ref: "#/components/schemas/Book"
                    facets:
                      type: object
                      properties:
                        categories:
                          type: array
                          items:
                            type: object
                            properties:
                              _id:
                                type: string
                              count:
                                type: integer
                        authors:
                          type: array
                          items:
                            type: object
                            properties:
                              _id:
                                type: string
                              count:
                                type: integer
                    currentPage:
                      type: integer
                      example: 1
                    totalPages:
                      type: integer
                      example: 5
                    totalBooks:
                      type: integer
                      example: 47
      "400":
        description: Missing or invalid query parameters
      "500":
        description: Server error
