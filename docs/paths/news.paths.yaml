/api/news/subscribe:
  post:
    summary: Subscribe to the newsletter
    tags: [News]
    description: >
      Subscribes a registered user to the weekly newsletter service.  
      The user must already have an account in the system.  
      Users who have unsubscribed more than twice cannot re-subscribe.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
                example: "user@example.com"
            required:
              - email
    responses:
      "200":
        description: Subscription successful
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            example:
              statusCode: 200
              data: null
              message: "Subscription successful!"
              success: true
      "400":
        description: Invalid request (e.g., missing email or already subscribed)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              missingEmail:
                summary: Missing email
                value:
                  statusCode: 400
                  message: "Email is required"
                  success: false
              alreadySubscribed:
                summary: Already subscribed
                value:
                  statusCode: 400
                  message: "You are already subscribed."
                  success: false
      "404":
        description: Email not found in system
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 404
              message: "Email not found. Please register first."
              success: false
      "403":
        description: User reached unsubscribe limit
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 403
              message: "This account cannot re-subscribe to the newsletter."
              success: false
      "500":
        description: Internal server error


/api/news/unsubscribe:
  patch:
    summary: Unsubscribe from the newsletter
    tags: [News]
    description: >
      Allows an authenticated user to unsubscribe from the weekly newsletter.  
      This action increases the user's `newsletterUnsubscribeCount` by 1.  
      Users who are not subscribed cannot unsubscribe.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Successfully unsubscribed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            example:
              statusCode: 200
              data: null
              message: "You have been unsubscribed."
              success: true
      "400":
        description: User not currently subscribed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 400
              message: "You are not currently subscribed."
              success: false
      "404":
        description: User not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 404
              message: "User not found."
              success: false
      "401":
        description: Unauthorized (Missing or invalid token)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 401
              message: "Invalid or missing authentication token"
              success: false
      "500":
        description: Internal server error
