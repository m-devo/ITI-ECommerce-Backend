paths:
  /api/cart:
    get:
      summary: Get the authenticated user's cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's cart retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse" # Assuming you have a standard wrapper
              example:
                statusCode: 200
                data:
                  _id: "68eb123456789abcdef12345"
                  userId: "68eaae855274aeb09fa23a2e"
                  items:
                    - quantity: 2
                      book:
                        _id: "68e7ed98aa7000812ffe6213"
                        title: "Machine Learning"
                        author: "Marijn Haverbeke"
                        price: 66
                        stock: 16
                message: "Cart retrieved successfully"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: "invalid token"
                success: false

  /api/cart/update:
    put:
      summary: Update multiple books in the cart
      tags: [Cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  bookId:
                    type: string
                  quantity:
                    type: integer
                    description: "Use quantity 0 to remove."
                    minimum: 0
            example:
              - bookId: "68e7ed98aa7000812ffe6213"
                quantity: 3
      responses:
        "200":
          description: Cart updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse" # Containing the updated Cart
        "400":
          description: Bad Request (e.g., out of stock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: "Only 16 units of Machine Learning are available"
                success: false
        "404":
          description: Not Found (e.g., bookId does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: "Book not found"
                success: false

  /api/cart/items/{bookId}/increment:
    put:
      summary: Increment an item's quantity by 1
      tags: [Cart]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookId
          schema:
            type: string
          required: true
          description: The ID of the book to increment.
          example: "68e7ed98aa7000812ffe6213"
      responses:
        "200":
          description: Item quantity incremented successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse" # Containing the updated Cart
        "400":
          description: Bad Request (e.g., out of stock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: "Only 16 units of Machine Learning are available"
                success: false

  /api/cart/items/{bookId}/decrement:
    put:
      summary: Decrement an item's quantity by 1
      tags: [Cart]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookId
          schema:
            type: string
          required: true
          description: The ID of the book to decrement.
          example: "68e7ed98aa7000812ffe6213"
      responses:
        "200":
          description: Item quantity decremented successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse" # Containing the updated Cart
        "404":
          description: Not Found (e.g., item not in cart)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: "Item not found in cart"
                success: false

  /api/cart/items/{bookId}:
    delete:
      summary: Remove an item completely from the cart
      tags: [Cart]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookId
          schema:
            type: string
          required: true
          description: The ID of the book to remove.
          example: "68e7ed98aa7000812ffe6213"
      responses:
        "200":
          description: Item removed from cart successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse" # Containing the updated Cart

  /api/cart/clear:
    delete:
      summary: Clear all items from the user's cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart cleared successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  _id: "68eb123456789abcdef12345"
                  userId: "68eaae855274aeb09fa23a2e"
                  items: []
                message: "Cart cleared successfully"

/api/cart/abandoned-cart:
  post:
    summary: Trigger abandoned cart reminders (Admin)
    tags: [Cart]
    description: >
      Manually triggers the service to find all carts that have been inactive 
      (between 1 and 4 days old) and sends a reminder email to the user.
      This endpoint is restricted to users with the 'admin' role.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: The reminder process executed successfully.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              noAbandonedCarts:
                summary: No abandoned carts found
                value:
                  statusCode: 200
                  data:
                    message: "No abandoned carts to remind."
                    count: 0
                  message: "Abandoned cart reminder process completed."
                  success: true
              remindersSent:
                summary: Some abandoned carts were found and emails sent
                value:
                  statusCode: 200
                  data:
                    message: "Abandoned cart reminders sent successfully."
                    count: 3
                  message: "Abandoned cart reminder process completed."
                  success: true
              errorExample:
                summary: Error occurred during process
                value:
                  statusCode: 500
                  data:
                    message: "Error in AbandonedCartReminder job."
                    error: "MongoDB connection lost"
                  message: "Abandoned cart reminder process completed."
                  success: false
      "401":
        description: Unauthorized (Invalid or missing token)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 401
              message: "invalid token"
              success: false
      "403":
        description: Forbidden (User is not an admin)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            example:
              statusCode: 403
              message: "You do not have permission to perform this action"
              success: false